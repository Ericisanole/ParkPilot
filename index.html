:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf1ff;background:#091120;font-size:15px}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 10% -10%,#263d72 0,transparent 43%),#091120}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #92bafc;outline-offset:2px}.shell{max-width:780px;margin:auto;min-height:100dvh;padding-bottom:105px}.header{padding:calc(env(safe-area-inset-top) + 24px) 20px 16px;display:flex;align-items:center;justify-content:space-between}.mark{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#59b9e7,#6352d6);box-shadow:0 8px 27px #3374c257;font-size:23px}.brand{font-size:21px;font-weight:800;letter-spacing:-.7px}.muted{color:#a2afc7}.tiny{font-size:12px}.iconbtn,.btn{border:1px solid #3a4a68;color:#eaf1ff;background:#1b2b47;border-radius:13px;padding:11px 15px}.iconbtn{font-size:20px;padding:9px 13px}.btn.primary{background:#7c94fb;color:#0b1731;border-color:#7c94fb;font-weight:800}.btn:disabled{opacity:.5}.main{padding:0 18px}.hero{border:1px solid #495682;background:linear-gradient(120deg,#202f60,#17294c 60%,#193d50);border-radius:25px;padding:22px;overflow:hidden;position:relative}.hero:after{content:'✦';font-size:125px;position:absolute;right:12px;top:-30px;color:#ffffff0b;pointer-events:none}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;font-weight:800;color:#9bd9e8}.hero h1{font-size:29px;letter-spacing:-1.1px;line-height:1.12;margin:10px 0}.hero p{max-width:370px;line-height:1.5;color:#c5d3ec;margin-bottom:18px}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 12px}.sectionhead h2{font-size:18px;margin:0;letter-spacing:-.3px}.panel{background:#131e33;border:1px solid #2a3b57;border-radius:19px;padding:16px;margin-bottom:12px}.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.stat{background:#121f39;border:1px solid #304465;border-radius:16px;padding:15px 11px}.stat b{font-size:23px;display:block;margin-bottom:2px}.stat span{color:#aab8d2;font-size:11px}.chips{display:flex;gap:7px;overflow:auto;padding:3px 0 12px;scrollbar-width:none}.chip{border-radius:999px;border:1px solid #42516d;background:#1a2942;color:#d7e3f7;padding:9px 13px;white-space:nowrap;font-weight:600;font-size:12px}.chip.active{background:#d5e6ff;color:#172445;border-color:#d5e6ff}.field{width:100%;padding:12px 13px;color:#eaf2ff;background:#0f192c;border:1px solid #3a4a68;border-radius:12px}.field::placeholder{color:#7f8da8}label{display:block;font-size:12px;font-weight:700;color:#b9c7df;margin:12px 0 6px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rides{display:grid;gap:10px}.ride{background:#131f34;border:1px solid #2c3b56;padding:15px;border-radius:17px}.rideTop{display:flex;align-items:start;justify-content:space-between;gap:8px}.ride h3{font-size:15px;line-height:1.4;margin:0 0 7px}.tag{display:inline-flex;font-size:11px;padding:5px 8px;border-radius:8px;background:#273950;color:#c7d8ec;margin:0 5px 5px 0}.tag.good{color:#94efc9;background:#164235}.tag.warn{color:#f4d299;background:#453522}.tag.bad{color:#f9a8ab;background:#4b2932}.wait{font-size:21px;font-weight:800;white-space:nowrap}.wait small{display:block;font-size:10px;font-weight:500;color:#9caec5;text-align:right}.rideFoot{border-top:1px solid #2a3b57;margin-top:11px;padding-top:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}.miniBtn{border:1px solid #3c4f6e;background:#1d2d49;color:#dceaff;border-radius:9px;padding:8px 10px;font-size:12px}.miniBtn.on{color:#f9ce79;background:#463a2a}.navbar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#101a2cf5;border-top:1px solid #30415c;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;backdrop-filter:blur(20px)}.nav{border:0;background:transparent;color:#a6b3cc;min-width:65px;padding:8px 5px;border-radius:12px;font-size:11px;display:grid;gap:5px;justify-items:center}.nav span{font-size:21px}.nav.active{color:#c2caff;background:#273456}.note{border-left:3px solid #83b6ff;background:#14243c;border-radius:9px;padding:11px 14px;font-size:12px;color:#c5d5ee;line-height:1.5}.empty{text-align:center;padding:30px 16px;color:#a8b8d1}.person{display:grid;grid-template-columns:1fr 90px 31px;gap:9px;align-items:end;margin:10px 0}.person label{margin:0 0 5px}.person .delete{height:43px;border:1px solid #663d4a;background:#3a2635;color:#f8b1bd;border-radius:10px}.toggle{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:10px 0}.toggle input{width:19px;height:19px;accent-color:#93a8ff}.divider{border-top:1px solid #2d3e58;margin:17px 0}.planrow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #2a3a53;padding:13px 0}.planrow:last-child{border:0}.planrow strong{font-size:13px}.pill{color:#9be4ce;font-size:12px}.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#d8edff;color:#13203b;padding:12px 20px;border-radius:15px;font-weight:700;box-shadow:0 12px 30px #0008;z-index:10;max-width:90vw}.hidden{display:none!important}.smallLink{color:#b1c6ff;text-decoration:underline}.foot{font-size:11px;line-height:1.5;color:#92a3bf;margin:22px 5px}.recommendation{background:linear-gradient(120deg,#244c50,#203350);border:1px solid #3e7c79;border-radius:17px;padding:16px}.recommendation h3{margin:7px 0;font-size:18px}.wide{width:100%}@media(min-width:700px){.main{padding:0 25px}.statgrid{gap:14px}.rides{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:350px){.controls{grid-template-columns:1 </style></head><body><div class="shell"><header class="header"><div class="mark"><div class="logo">✦</div><div><div class="brand">ParkPilot</div><div class="tiny muted">Your family's park companion</div></div></div><button class="iconbtn" onclick="go('settings')" aria-label="Settings">⚙</button></header><main id="app" class="main"></main></div><nav class="navbar" aria-label="Main navigation"><button class="nav active" data-tab="today" onclick="go('today')"><span>⌂</span>Today</button><button class="nav" data-tab="rides" onclick="go('rides')"><span>◈</span>Rides</button><button class="nav" data-tab="plan" onclick="go('plan')"><span>☷</span>My Plan</button><button class="nav" data-tab="family" onclick="go('family')"><span>♧</span>Family</button><button class="nav" data-tab="settings" onclick="go('settings')"><span>⚙</span>Settings</button></nav><div id="toast" class="toast hidden" role="status"></div><input type="file" id="restoreFile" accept="application/json,.json" class="hidden" onchange="restoreFile(event)">
<script>
'use strict';
const STORE='parkpilot_family_v1',API='https://api.themeparks.wiki/v1';
const PARKS=[{key:'mk',name:'Magic Kingdom',match:'magic kingdom',id:'75ea578a-adc8-4116-a54d-dccb60765ef9',short:'Kingdom'},{key:'ep',name:'EPCOT',match:'epcot',id:null,short:'EPCOT'},{key:'hs',name:'Hollywood Studios',match:'hollywood studios',id:null,short:'Studios'},{key:'ak',name:'Animal Kingdom',match:'animal kingdom',id:null,short:'Animal'}];
const DEFAULT={park:'mk',people:[{name:'Adult 1',height:70,selected:true},{name:'Adult 2',height:65,selected:true},{name:'Child 1',height:44,selected:true},{name:'Child 2',height:34,selected:true}],favorites:[],done:[],plan:[],notes:'',maxWait:45,showUnknown:true,showClosed:false,sort:'wait',filter:'all'};
let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch{}let state={...DEFAULT,...saved},tab='today',live=[],lastFetch=null,err='',loading=false,search='',parkIds={},dataPark='',lastSyncByPark={},notice='';
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){notify('Storage unavailable: export your backup')}};
const change=(key,value)=>{state[key]=value;save();render()};
const doSet=(type,id)=>{let list=state[type]||[];state[type]=list.includes(id)?list.filter(x=>x!==id):[...list,id];save();render()};
const safeId=id=>JSON.stringify(String(id));
function notify(s){let el=byId('toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.add('hidden'),2500)}
function go(t){tab=t;document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.tab===t));render();window.scrollTo({top:0,behavior:'instant'});if(t==='today'||t==='rides')getLive()}
const hours=d=>d?new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
// Minimum rider heights in inches for select rides; check official rules onsite. Unknowns are never assumed safe.
const HEIGHTS=[['seven dwarfs mine train',38],['big thunder mountain',40],['space mountain',44],['tron lightcycle',48],['tiana',40],['barnstormer',35],['tomorrowland speedway',32],['goofy',35],['slinky dog dash',38],['rise of the resistance',40],['millennium falcon',38],['tower of terror',40],['rock n roller',48],['star tours',40],['alien swirling saucers',32],['test track',40],['guardians of the galaxy',42],['mission space',40],['soarin',40],['frozen ever after',0],['remy',0],['expedition everest',44],['avatar flight of passage',44],['na vi river journey',0],['kali river rapids',38],['dinosaur',40],['kilimanjaro safaris',0],['pirates of the caribbean',0],['haunted mansion',0],['jungle cruise',0],['its a small world',0],['peter pans flight',0],['under the sea',0],['buzz lightyear',0]];
const normalize=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function heightFor(n){const norm=normalize(n);let item=HEIGHTS.find(([s])=>norm.includes(s));return item?item[1]:null}
function typeFor(n,raw){let t=normalize(n);if(/coaster|mountain|everest|tron|slinky|barnstormer|guardians|rock n roller|mine train/.test(t))return 'Thrill';if(/railroad|train|transport|monorail|ferry|peoplemover/.test(t))return 'Transport';if(/show|theater|theatre|hall|philharmagic|festival|musical|encanto|carousel of progress/.test(t)||raw.entityType==='SHOW')return 'Show';return 'Ride'}
function makeRide(r){let q=r.queue?.STANDBY;let wait=typeof q?.waitTime==='number'?q.waitTime:null;return {id:r.id,name:r.name||'Unnamed attraction',status:r.status||'UNKNOWN',wait,height:heightFor(r.name),type:typeFor(r.name,r),updated:r.lastUpdated}}
async function getLive(force=false){let key=state.park;if(loading)return;if(!force&&dataPark===key&&Date.now()-(lastSyncByPark[key]||0)<65000)return;loading=true;err='';render();try{let park=PARKS.find(p=>p.key===key);let id=parkIds[key]||park.id;
if(!id){let resp=await fetch(API+'/destinations');if(!resp.ok)throw Error('Park directory unavailable');let json=await resp.json();let dests=Array.isArray(json)?json:(json.destinations||[]);let target=dests.find(d=>normalize(d.name).includes('walt disney world'));
let parks=target?.parks||[];if(!parks.length){let resp2=await fetch(API+'/entity/'+target.id+'/children');if(!resp2.ok)throw Error('Park list unavailable');let sub=await resp2.json();parks=sub.children||[]}
PARKS.forEach(p=>{let match=parks.find(k=>normalize(k.name).includes(p.match));if(match)parkIds[p.key]=match.id});id=parkIds[key];if(!id)throw Error('Could not match this park in the directory')}
let res=await fetch(`${API}/entity/${encodeURIComponent(id)}/live`);if(!res.ok)throw Error(`Wait-time service returned ${res.status}`);let payload=await res.json();if(!Array.isArray(payload.liveData))throw Error('Invalid wait-time response');live=payload.liveData.filter(x=>x.entityType!=='RESTAURANT').map(makeRide);dataPark=key;lastFetch=new Date();lastSyncByPark[key]=Date.now();if(!live.length)notice='The API returned no attractions for this park';else notice='';}catch(e){err=e.message||'Unable to load live data';if(dataPark!==key)live=[];}finally{loading=false;render()}}
function filtered(){let q=normalize(search),people=state.people.filter(p=>p.selected),availableHeights=people.map(p=>Number(p.height)||0);let arr=live.filter(r=>!q||normalize(r.name).includes(q)).filter(r=>state.filter==='all'||(state.filter==='favorites'?state.favorites.includes(r.id):state.filter==='eligible'?eligible(r,availableHeights):r.type===state.filter)).filter(r=>state.showClosed||r.status==='OPERATING').filter(r=>state.showUnknown||r.height!==null);
return arr.sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name):state.sort==='height'?(a.height??999)-(b.height??999):state.sort==='favorites'?Number(state.favorites.includes(b.id))-Number(state.favorites.includes(a.id)): (a.wait??9999)-(b.wait??9999))}
function eligible(r,heights){return r.height!==null&&heights.length>0&&heights.every(h=>h>=r.height)}
function grade(r){if(r.status!=='OPERATING')return ['Unavailable','bad'];if(r.wait===null)return ['No posted wait',''];if(r.wait<=20)return ['Short wait','good'];if(r.wait<=state.maxWait)return ['Within target','good'];return ['Long wait','warn']}
function rideCard(r){let g=grade(r),sel=state.people.filter(p=>p.selected),fit=r.height===null?'Height unverified':r.height===0?'No minimum height listed':`${r.height}″ minimum`;let some=sel.filter(p=>r.height!==null&&Number(p.height)>=r.height).map(p=>p.name),all=sel.length>0&&some.length===sel.length;return `<article class="ride"><div class="rideTop"><div><h3>${ESC(r.name)}</h3><div><span class="tag">${ESC(r.type)}</span><span class="tag">${ESC(fit)}</span></div></div><div class="wait">${r.wait===null?'—':r.wait+'m'}<small>${r.status==='OPERATING'?'posted wait':ESC(r.status.toLowerCase())}</small></div></div><div class="row wrap"><span class="tag ${g[1]}">${g[0]}</span><span class="tag ${r.height===null?'warn':all?'good':'warn'}">${r.height===null?'Verify eligibility':all?'All selected eligible':some.length?ESC(some.join(', '))+' eligible':'Not all eligible'}</span></div><div class="rideFoot"><span class="muted tiny">${r.updated?'Updated '+hours(r.updated):'No update time'}</span><div class="row"><button class="miniBtn ${state.favorites.includes(r.id)?'on':''}" onclick='doSet("favorites",${safeId(r.id)})'>${state.favorites.includes(r.id)?'★':'☆'} Save</button><button class="miniBtn" onclick='doSet("plan",${safeId(r.id)})'>${state.plan.includes(r.id)?'✓ Planned':'+ Plan'}</button></div></div></article>`}
const parkSelect=()=>`<select class="field" aria-label="Choose Disney park" onchange="change('park',this.value)">${PARKS.map(p=>`<option value="${p.key}" ${state.park===p.key?'selected':''}>${p.name}</option>`).join('')}</select>`;
function summary(){let operating=live.filter(r=>r.status==='OPERATING'),numeric=operating.filter(r=>r.wait!==null),avg=numeric.length?Math.round(numeric.reduce((a,r)=>a+r.wait,0)/numeric.length):null;return `<div class="statgrid"><div class="stat"><b>${operating.length||'—'}</b><span>Operating rides</span></div><div class="stat"><b>${avg===null?'—':avg+'m'}</b><span>Avg posted wait</span></div><div class="stat"><b>${state.plan.length}</b><span>Planned attractions</span></div></div>`}
function bestRide(){return live.filter(r=>r.status==='OPERATING'&&r.wait!==null&&r.wait<=state.maxWait&&eligible(r,state.people.filter(p=>p.selected).map(p=>Number(p.height)||0))).filter(r=>!state.done.includes(r.id)).sort((a,b)=>Number(state.favorites.includes(b.id))*-20+ b.wait - (Number(state.favorites.includes(a.id))*-20 + a.wait))[0]}
function status(){return `<p class="tiny muted">${loading?'Updating live waits…':err?'Live data unavailable: '+ESC(err):dataPark===state.park&&lastFetch?'Live board fetched '+hours(lastFetch):'Live wait times not loaded'} ${!loading?'<button class="miniBtn" onclick="getLive(true)">↻ Refresh</button>':''}</p>${err?'<div class="note">The app does not invent wait times. Check your connection and refresh. Saved preferences and plans remain on this device.</div>':''}`}
function viewToday(){let p=PARKS.find(p=>p.key===state.park),ride=bestRide();return `<div class="hero"><span class="eyebrow">Your day, simplified</span><h1>Make every<br>park minute count.</h1><p>Find shorter queues, plan family-friendly rides, and keep your day organized.</p>${parkSelect()}${summary()}</div>${status()}<div class="sectionhead"><h2>Best move right now</h2><span class="tiny muted">Rule-based suggestion</span></div>${ride?`<div class="recommendation"><span class="eyebrow">Based on live posted wait & height</span><h3>${ESC(ride.name)}</h3><p class="muted">Posted wait: <strong>${ride.wait} min</strong>. Everyone selected meets the listed minimum height. ${state.favorites.includes(ride.id)?'This is also on your favorites list.':''}</p><button class="btn primary" onclick='doSet("plan",${safeId(ride.id)})'>${state.plan.includes(ride.id)?'Remove from plan':'+ Add to my plan'}</button></div>`:`<div class="panel muted">No verified all-family short-wait option is available from current data. Check ride details or adjust your selected riders and wait limit.</div>`}<div class="sectionhead"><h2>Quick access</h2></div><div class="row wrap"><button class="btn" onclick="go('rides')">Browse waits →</button><button class="btn" onclick="go('family')">Set ride heights →</button><button class="btn" onclick="go('plan')">Open itinerary →</button></div><div class="sectionhead"><h2>Family snapshot</h2></div><div class="panel">${state.people.map(p=>`<div class="row between" style="padding:6px 0"><strong>${ESC(p.name)}</strong><span class="muted">${ESC(p.height)}″ ${p.selected?'· Selected':''}</span></div>`).join('')}</div>`}
function viewRides(){let rides=filtered();return `<div class="sectionhead" style="margin-top:5px"><h2>Live attraction board</h2><span class="tiny muted">${rides.length} results</span></div>${parkSelect()}${status()}<label for="q">Find a ride</label><input id="q" class="field" placeholder="Search attractions…" value="${ESC(search)}" oninput="search=this.value;renderRidesOnly()"><div class="sectionhead"><h2>Filters</h2></div><div class="chips">${['all','eligible','favorites','Ride','Thrill','Show','Transport'].map(f=>`<button class="chip ${state.filter===f?'active':''}" onclick="change('filter',${ESC(JSON.stringify(f))})">${f==='eligible'?'Everyone eligible':f==='all'?'All attractions':ESC(f)}</button>`).join('')}</div><div class="controls"><div><label>Sort by</label><select class="field" onchange="change('sort',this.value)">${[['wait','Shortest wait'],['name','A to Z'],['height','Height requirement'],['favorites','Favorites first']].map(([v,n])=>`<option value="${v}" ${state.sort===v?'selected':''}>${n}</option>`).join('')}</select></div><div><label>Maximum comfortable wait</label><select class="field" onchange="change('maxWait',Number(this.value))">${[15,20,30,45,60,90,120].map(v=>`<option value="${v}" ${state.maxWait===v?'selected':''}>${v} min</option>`).join('')}</select></div></div><div class="panel" style="margin-top:12px"><div class="toggle"><span>Include rides with unknown height rules</span><input type="checkbox" ${state.showUnknown?'checked':''} onchange="change('showUnknown',this.checked)"></div><div class="toggle"><span>Include closed / unavailable rides</span><input type="checkbox" ${state.showClosed?'checked':''} onchange="change('showClosed',this.checked)"></div></div><div id="rideResults">${rides.length?`<div class="rides">${rides.map(rideCard).join('')}</div>`:`<div class="empty">${loading?'Loading wait-time board…':dataPark!==state.park?'Choose Refresh to fetch this park':'No matching attractions. Try another filter or enable unavailable rides.'}</div>`}</div><p class="foot">Height rules are a small, locally maintained reference list, not an official accessibility determination. Unknown requirements are marked as unverified. Consult Disney's published requirements and Cast Members.</p>`}
function renderRidesOnly(){let el=byId('rideResults');if(el){let rides=filtered();el.innerHTML=rides.length?`<div class="rides">${rides.map(rideCard).join('')}</div>`:'<div class="empty">No matching attractions.</div>'}}
function viewPlan(){let rides=state.plan.map(id=>live.find(r=>r.id===id));return `<div class="sectionhead"><h2>My park plan</h2><span class="muted tiny">${state.plan.length} attractions</span></div>${parkSelect()}<div class="note">This itinerary is saved on your device. Attractions from another park may appear without current names after switching parks; saved items remain in your plan.</div><div class="sectionhead"><h2>Saved attractions</h2></div><div class="panel">${state.plan.length?state.plan.map((id,i)=>{let r=rides[i];return `<div class="planrow"><div><strong>${r?ESC(r.name):'Saved ride from another park'}</strong><div class="muted tiny">${r?r.wait===null?'No wait available':r.wait+' min posted wait':'ID: '+ESC(id.slice(0,8))}</div></div><div class="row"><button class="miniBtn ${state.done.includes(id)?'on':''}" onclick='doSet("done",${safeId(id)})'>${state.done.includes(id)?'✓ Done':'Mark done'}</button><button class="miniBtn" onclick='doSet("plan",${safeId(id)})'>×</button></div></div>`}).join(''):'<div class="empty">Your itinerary is empty. Add rides from the Rides tab.</div>'}</div><div class="sectionhead"><h2>Notes & reservations</h2></div><div class="panel"><label for="notes">Keep dining times, Lightning Lane times, breaks, or travel notes</label><textarea id="notes" class="field" rows="7" placeholder="12:00 lunch · 2:30 Lightning Lane · 4:00 snack break…" oninput="state.notes=this.value;save()">${ESC(state.notes)}</textarea></div><button class="btn wide" onclick="exportPlan()">Copy itinerary</button>`}
function personRow(p,i){return `<div class="person"><div><label>Rider name</label><input class="field" value="${ESC(p.name)}" onchange="personChange(${i},'name',this.value)"></div><div><label>Height (in)</label><input class="field" type="number" min="0" max="96" step="0.5" value="${ESC(p.height)}" onchange="personChange(${i},'height',Number(this.value))"></div><button class="delete" title="Remove rider" onclick="removePerson(${i})">×</button></div><div class="toggle"><span class="tiny muted">Include ${ESC(p.name)} in all-family eligibility?</span><input type="checkbox" ${p.selected?'checked':''} onchange="personChange(${i},'selected',this.checked)"></div>`}
function personChange(i,k,v){state.people[i][k]=v;save();render()}
function removePerson(i){if(state.people.length<=1)return notify('Keep at least one rider');state.people.splice(i,1);save();render()}
function addPerson(){state.people.push({name:'Rider '+(state.people.length+1),height:40,selected:true});save();render()}
function viewFamily(){return `<div class="sectionhead"><h2>Family & ride heights</h2></div><div class="panel"><p class="muted">Use actual measured heights. Only selected riders are checked for the “Everyone eligible” filter and ride suggestions.</p>${state.people.map(personRow).join('<div class="divider"></div>')}<button class="btn primary wide" onclick="addPerson()">+ Add a family member</button></div><div class="note">Height restrictions can change, and some rides have other safety/accessibility requirements. Always verify eligibility with the park.</div>`}
function exportBackup(){let b=new Blob([JSON.stringify({app:'ParkPilot',version:1,exportedAt:new Date().toISOString(),preferences:state},null,2)],{type:'application/json'});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download='parkpilot-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);notify('Backup ready to save')}
async function restoreFile(e){let f=e.target.files?.[0];if(!f)return;try{let payload=JSON.parse(await f.text());let s=payload.preferences;if(payload.app!=='ParkPilot'||!s||!Array.isArray(s.people)||!Array.isArray(s.plan)||!Array.isArray(s.favorites))throw Error('Invalid ParkPilot backup');if(!confirm('Replace current local preferences and plan with this backup?'))return;state={...DEFAULT,...s};save();render();notify('Backup restored')}catch(ex){notify('Unable to import: '+ex.message)}finally{e.target.value=''}}
async function exportPlan(){let txt=[`ParkPilot · ${PARKS.find(p=>p.key===state.park).name}`,`Saved attractions:`,...state.plan.map((id,i)=>`${i+1}. ${live.find(r=>r.id===id)?.name||'Ride ID '+id}${state.done.includes(id)?' ✓':''}`),'',`Notes: ${state.notes||'None'}`].join('\n');try{await navigator.clipboard.writeText(txt);notify('Itinerary copied')}catch{let b=new Blob([txt],{type:'text/plain'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='parkpilot-itinerary.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
function clearData(){if(confirm('Delete ALL ParkPilot preferences, family profiles and plans stored in this browser?')){state=structuredClone(DEFAULT);save();render();notify('Local data reset')}}
function viewSettings(){return `<div class="sectionhead"><h2>Settings & privacy</h2></div><div class="panel"><h3>Offline-first preferences</h3><p class="muted">Family heights, favorites, plans, checkmarks and notes are stored in this browser's local storage. No account, sign-in or cloud database required.</p><button class="btn primary wide" onclick="exportBackup()">↓ Export JSON backup</button><div style="height:10px"></div><button class="btn wide" onclick="byId('restoreFile').click()">↑ Import JSON backup</button></div><div class="panel"><h3>Live wait-time feed</h3><p class="muted">ParkPilot retrieves real-time posted ride waits from ThemeParks.wiki when connected. No API key is required. Refresh is manual or on entering a park tab (no more than once per minute).</p><a class="smallLink" href="https://www.themeparks.wiki/api" target="_blank" rel="noopener">Powered by ThemeParks.wiki</a><div class="divider"></div><a class="smallLink" target="_blank" rel="noopener" href="https://disneyworld.disney.go.com/faq/parks/height-requirements/">Official Disney height requirements ↗</a></div><div class="panel"><h3>Important limitations</h3><p class="muted">No background alerts, Lightning Lane availability tracking, dining reservation notifications, paid AI chat, navigation, or predictive wait-time model are included in this first version. If loaded from a local file, browser storage or network access may be restricted. For reliable iPhone Home Screen behavior, serve this app from an HTTPS website.</p><button class="btn" style="color:#ffd5d5" onclick="clearData()">Erase local data</button></div><p class="foot">Independent, unofficial project. Not affiliated with or endorsed by Disney. Disney and attraction names belong to their owners. Do not rely on this app for safety-critical ride eligibility.</p>`}
function render(){byId('app').innerHTML=tab==='today'?viewToday():tab==='rides'?viewRides():tab==='plan'?viewPlan():tab==='family'?viewFamily():viewSettings()}
render();getLive();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
