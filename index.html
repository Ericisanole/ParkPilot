:root {

* {box-sizing:border-box}

.primary,.chip.active {background:var(--royal);border-color:#758fff}

.wide {width:100%;margin-top:12px}

.tag {display:inline-block;border-radius:999px;padding:4px 8px;margin:4px 3px 0 0;background:#1d366b;color:#dce6ff;font-size:.73rem}
.good {color:#96f3be;background:#124037}
.warn,.bad {color:#ffd0cc;background:#542939}
.on {border-color:var(--gold);color:var(--gold)}
.wrap,.chips {display:flex;flex-wrap:wrap;gap:6px}
.advanced {margin:12px 0;padding:0 12px 8px}
.advanced summary {min-height:44px;padding:12px 0;font-weight:600}
.controls,.person {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.person {grid-template-columns:minmax(0,1fr) minmax(62px,.48fr) 44px}
label {display:block;color:var(--muted);font-size:.83rem;margin:4px 0 6px}
.toggle {min-height:44px;margin-top:8px}

.toggle input::before {content:"";width:22px;height:22px;border:1px solid var(--accent);border-radius:6px;background:#142955}
.toggle input:checked::before {content:"✓";display:grid;place-content:center;background:var(--royal);color:var(--text)}
.navbar {position:fixed;z-index:5;bottom:0;left:0;right:0;margin:auto;width:min(100%,880px);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:#081632;border:1px solid #263f73;border-radius:17px 17px 0 0;padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));box-shadow:0 -8px 28px #030a2055}
.nav {border:1px solid transparent;background:none;border-radius:12px;min-height:51px;padding:4px 0;color:var(--muted);display:grid;justify-items:center;align-content:center;gap:3px;font-size:.68rem;font-weight:500;white-space:nowrap}
.nav.active {color:var(--text);background:var(--royal);border-color:#708cff}
.nav.active .icon {color:var(--gold)}
.toast {position:fixed;z-index:6;bottom:calc(77px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90vw;background:var(--navy);border:1px solid var(--line);padding:10px 14px;border-radius:12px}
.hidden {display:none}
@media (min-width:650px) {.rides,.profiles {grid-template-columns:repeat(2,minmax(0,1fr))}.hero {padding:24px;background-size:auto,auto 140%,auto}.recommendation {grid-template-columns:120px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference) {button {transition:background-color .16s,border-color .16s}}
.extra-nav{display:flex;gap:6px;overflow-x:auto;padding:5px 0 12px;scrollbar-width:thin}.extra-nav button{flex:none}.extra-nav .active{background:var(--royal);border-color:var(--accent)}
a{color:#b8ceff}a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.chart-row{display:grid;grid-template-columns:minmax(95px,1fr) 2fr 55px;gap:8px;align-items:center;margin:12px 0;font-size:.82rem}.chart-track{height:12px;border-radius:8px;background:#07132d}.chart-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,#2155e8,#ad8aff)}.venue-photo{margin:0 0 12px}.venue-photo img{width:100%;height:160px;object-fit:cover;border-radius:12px}.venue-photo figcaption{font-size:.7rem;color:var(--muted);line-height:1.5}.photo-options{display:grid;gap:10px}.photo-options img{max-width:100%;height:150px;object-fit:cover}.photo-tools{margin-bottom:10px}.answer{white-space:pre-wrap;line-height:1.6}.link-card{display:block;margin:10px 0;padding:15px;text-decoration:none;border:1px solid var(--line);border-radius:12px;background:var(--card)}.link-card strong{display:block;color:var(--text)}.trend{width:100%;height:auto}.chat-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.photo-candidate{border:1px solid var(--line);border-radius:12px;padding:12px}.smallLink{overflow-wrap:anywhere}
